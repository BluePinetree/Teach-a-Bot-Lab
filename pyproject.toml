[project]
name = "teachabot"
version = "0.1.0"
description = "Teach-a-Bot Lab: Joy-Con teleoperation and imitation learning demo for high-school lab visits"
requires-python = ">=3.12,<3.13"
dependencies = [
    "joycon-python==0.2.4",
    "hidapi==0.15.0",
    "pyglm==2.8.3",
    "numpy==2.5.4",
    "ursina==8.3.0",
    "opencv-python==5.0.0.93",
    "mediapipe==1.1.1",
    "mujoco==3.16.0",
    "mink==1.3.0",
    "pillow==13.0.0",
    "gymnasium==1.4.0",
    "stable-baselines3==2.9.0",
    "torch==2.14.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
